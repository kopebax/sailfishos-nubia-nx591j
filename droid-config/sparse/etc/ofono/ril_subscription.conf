# Android 7 (hybris-14.1) RIL uses sockets, not binder.
# Dual SIM (persist.radio.multisim.config=dsds): rild -> slot 1, rild -c 2 -> slot 2.
# At boot qcril restarts itself once (IPC router permissions are set up by
# irsc_util in parallel) and is ready only after ~35 s, so wait longer than
# the default 20 s before giving up on a slot.

[Settings]
EmergencyCallsWithoutSim=true

[ril_0]
name=RIL1
socket=/dev/socket/rild
slot=0
enable4G=true
startTimeout=90000

[ril_1]
name=RIL2
socket=/dev/socket/rild2
slot=1
enable4G=false
startTimeout=90000
