# sensors.qcom starts together with sensorfwd. If sensorfwd opens the sensors
# HAL before the daemon has created its control socket, the accelerometer
# adaptor stays invalid and screen rotation never works. Wait for it.
[Unit]
After=droid-hal-init.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do [ -S /dev/socket/sensor_ctl_socket ] && break; sleep 1; done; sleep 1'
